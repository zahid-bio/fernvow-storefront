<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="app" class="app-shell">
    <div id="header-root"></div>
    <button type="button" id="quick-checkout" class="btn btn--fern quick-checkout" data-action="prepare-checkout" hidden>
      Checkout
    </button>
    <main id="main-content" class="site-main" tabindex="-1"></main>

    <div id="overlay-root"></div>

  <aside id="cookie-preferences" class="cookie-preferences" aria-labelledby="cookie-preferences-title" hidden>
    <h2 id="cookie-preferences-title" tabindex="-1">Cookie preferences</h2>
    <p><span data-cookie-notice>Essential storage keeps your bag working. You can also allow analytics and advertising measurement.</span> <a href="/policies/privacy">Privacy policy</a></p>
    <details class="cookie-preferences__settings">
      <summary>Choose settings</summary>
      <fieldset>
        <legend class="sr-only">Optional cookies</legend>
        <label><input type="checkbox" name="analytics" /> <span><strong>Analytics</strong><small>Understand how visitors use the store.</small></span></label>
        <label><input type="checkbox" name="advertising" /> <span><strong>Advertising</strong><small>Measure visits and orders from ads.</small></span></label>
      </fieldset>
      <button type="button" class="btn btn--outline" data-cookie-action="save">Save preferences</button>
    </details>
    <div class="cookie-preferences__actions">
      <button type="button" class="btn btn--outline" data-cookie-action="essential">Essential only</button>
      <button type="button" class="btn btn--fern" data-cookie-action="allow">Allow all</button>
      <button type="button" class="btn btn--fern" data-cookie-action="dismiss" hidden>Continue</button>
