  <script>
    (() => {
      // Checkout returns can carry order and Stripe session identifiers in the URL.
      const { search, hash } = window.location;
      const params = new URLSearchParams(search);
      if (params.has('order') || params.has('session_id') || /^#\/checkout(?:\/|$)/.test(hash)) return;

      window.dataLayer = window.dataLayer || [];
      window.gtag = function gtag() { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());

      const tag = document.createElement('script');
      tag.async = true;
      tag.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-5VF96GZH';
      document.head.append(tag);
    })();
  </script>
