      <text x="14" y="16.5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="600" fill="#181B17">5</text>
      <text x="14" y="30" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="600" letter-spacing="0.6" fill="#181B17">PP</text>
      <text x="34" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.2" fill="#595D56">Pump &amp; Cap</text>
    </g>

