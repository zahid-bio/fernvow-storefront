  <!-- ==================== BACK INFORMATION PANEL ==================== -->
  <g>
    <text x="502" y="96" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.8" fill="#3E4F3D">HOW TO USE / DIRECTIONS</text>
    <line x1="502" y1="103" x2="882" y2="103" stroke="#181B17" stroke-opacity="0.14" stroke-width="0.8"/>
    <text x="502" y="119" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-style="italic" fill="#595D56">For external use only. Avoid direct contact with eyes.</text>
    <text x="502" y="136" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.3" fill="#181B17">1. Wet face with lukewarm water and dispense foam into hands.</text>
    <text x="502" y="150.6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.3" fill="#181B17">2. Massage gently over face to lift impurities, then rinse</text>
    <text x="513" y="163.2" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.3" fill="#181B17">thoroughly.</text>
    <text x="502" y="177.79999999999998" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.3" fill="#181B17">3. Pat dry. Use morning and evening before toner and moisturizer.</text>

    <text x="502" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.8" fill="#3E4F3D">INGREDIENTS (INCI)</text>
    <line x1="502" y1="221" x2="882" y2="221" stroke="#181B17" stroke-opacity="0.14" stroke-width="0.8"/>
    <text x="502" y="238" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.1" fill="#181B17">
      <tspan x="502" dy="0">Aqua/Water, Cocamidopropyl Betaine, Rosa Damascena (Rose) Flower</tspan>
        <tspan x="502" dy="12.2">Water*, Glycerin, Sucrose Cocoate, Sodium Levulinate, Lactic Acid,</tspan>
        <tspan x="502" dy="12.2">Sodium Anisate, Calendula Officinalis (Calendula) Flower Extract*,</tspan>
        <tspan x="502" dy="12.2">Chamomilla Recutita (Chamomile) Flower Extract*, Parfum/Fragrance,</tspan>
        <tspan x="502" dy="12.2">Benzyl Alcohol, Sodium Benzoate, Potassium Sorbate</tspan>
    </text>
    <text x="502" y="302.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.0" font-style="italic" fill="#595D56">*Ingredients from organic farming.</text>

    <!-- Recycling & Resin Codes -->
    <line x1="502" y1="366" x2="882" y2="366" stroke="#181B17" stroke-opacity="0.14" stroke-width="0.8"/>
    <g transform="translate(502, 380)">
