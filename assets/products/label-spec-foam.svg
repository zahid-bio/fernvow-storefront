      <text x="14" y="16.5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="600" fill="#181B17">2</text>
      <text x="14" y="30" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="600" letter-spacing="0.6" fill="#181B17">HDPE</text>
      <text x="34" y="13" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.2" fill="#595D56">Bottle: HDPE #2 · Separate PP #5 pump &amp; cap before recycling.</text>
    </g>
    <g transform="translate(802, 380)">
