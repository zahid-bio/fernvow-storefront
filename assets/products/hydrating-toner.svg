    </g>
    <g transform="translate(-51, -280) scale(0.285)">
  <path transform="translate(60.2, 0)" d="M 3.3 54.0 L 14.3 54.0 L 14.3 52.85 C 12.1 52.85, 11.0 51.4, 11.0 49.0 L 11.0 30.20 L 16.8 30.20 L 16.8 29.0 L 11.0 29.0 L 11.0 21.5 C 11.0 16.2, 13.0 13.3, 15.8 13.3 C 16.9 13.3, 17.6 13.7, 18.0 14.2 C 17.1 14.5, 16.5 15.4, 16.5 16.5 C 16.5 17.9, 17.6 19.0, 19.0 19.0 C 20.5 19.0, 21.6 17.8, 21.6 16.1 C 21.6 13.5, 19.2 11.8, 15.8 11.8 C 10.6 11.8, 6.5 15.8, 6.5 22.8 L 6.5 29.0 L 2.2 29.0 L 2.2 30.20 L 6.5 30.20 L 6.5 49.0 C 6.5 51.4, 5.4 52.85, 3.3 52.85 Z" fill="#181B17" fill-rule="evenodd"/>
