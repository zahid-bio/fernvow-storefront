    <!-- FRAGRANCE FREE badge -->
    <rect x="-46" y="-137" width="92" height="18" rx="9" fill="none" stroke="#3E4F3D" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="0" y="-125" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.2" font-weight="500" letter-spacing="1.2" fill="#3E4F3D">FRAGRANCE FREE</text>

    <line x1="-50" y1="-98" x2="50" y2="-98" stroke="#181B17" stroke-opacity="0.12" stroke-width="0.8"/>
