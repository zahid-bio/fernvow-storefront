  <path d="M 34.7 27.1 C 39.4 26.3, 44.0 24.0, 47.0 20.6 C 42.8 21.5, 38.5 23.4, 35.1 25.7 Z" fill="#3E4F3D"/>
  <path d="M 37.1 21.6 C 41.0 20.7, 44.4 18.7, 46.7 15.8 C 43.4 16.8, 40.0 18.6, 37.5 20.4 Z" fill="#3E4F3D"/>
  <path d="M 39.7 16.7 C 42.6 15.8, 45.0 14.2, 46.5 12.0 C 44.0 12.9, 41.6 14.4, 40.0 15.7 Z" fill="#3E4F3D"/>
  </g>
  <!-- Architectural warm travertine plinth line -->
  <rect x="0" y="595" width="600" height="125" fill="url(#toner-plinth)"/>
  <line x1="0" y1="595" x2="600" y2="595" stroke="#181B17" stroke-opacity="0.08" stroke-width="1"/>
  <g transform="translate(300, 608) scale(1.0)">
    <!-- Ground shadows -->
    <ellipse cx="34" cy="2" rx="124" ry="14" fill="url(#toner-cast-shadow)" filter="url(#toner-soft-blur)"/>
    <ellipse cx="0" cy="1" rx="85" ry="10" fill="url(#toner-floor-shadow)"/>

    <!-- Tall sturdy matte white PET #1 cylinder with crisp slight shoulder -->
    <path d="M -78.0 -370
             C -78.0 -387, -63.0 -395, -44.5 -398
             L 44.5 -398
             C 63.0 -395, 78.0 -387, 78.0 -370
             L 78.0 -8
             C 78.0 -2, 74.0 0, 66.0 0
             L -66.0 0
             C -74.0 0, -78.0 -2, -78.0 -8 Z"
          fill="url(#toner-cyl-white)" stroke="#181B17" stroke-opacity="0.11" stroke-width="1"/>

    <!-- Crisp shoulder highlight line -->
    <path d="M -70.0 -378 C -58.0 -388, -46.5 -394, 0 -394 C 46.5 -394, 58.0 -388, 70.0 -378"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2"/>

    <!-- Wrap-around Fernvow Label -->
    <rect x="-77.0" y="-330" width="154" height="276" fill="url(#toner-label-wrap)"/>
    <line x1="-77.0" y1="-330" x2="77.0" y2="-330" stroke="#181B17" stroke-opacity="0.12" stroke-width="0.9"/>
    <line x1="-77.0" y1="-54" x2="77.0" y2="-54" stroke="#181B17" stroke-opacity="0.12" stroke-width="0.9"/>

