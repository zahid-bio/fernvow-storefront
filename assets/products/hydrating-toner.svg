<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img" aria-label="Fernvow Hydrating Toner 200 mL studio packaging concept">
  <defs>
    <!-- Sunlit Studio Alabaster Backdrop -->
    <radialGradient id="toner-bg-glow" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="58%" stop-color="#F6F4EF"/>
      <stop offset="100%" stop-color="#ECE8DF"/>
    </radialGradient>

    <!-- Studio Plinth Surface -->
    <linearGradient id="toner-plinth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFECE4"/>
      <stop offset="100%" stop-color="#E5E0D5"/>
    </linearGradient>

    <!-- Matte White Cylindrical Shading (left key light -> bright specular -> warm shadow -> right rim light) -->
    <linearGradient id="toner-cyl-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DEDAD0"/>
      <stop offset="8%" stop-color="#F1EFE9"/>
      <stop offset="24%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#FCFBF8"/>
      <stop offset="68%" stop-color="#EDEAE2"/>
      <stop offset="88%" stop-color="#D7D2C6"/>
      <stop offset="96%" stop-color="#E6E2D8"/>
      <stop offset="100%" stop-color="#CFC9BC"/>
    </linearGradient>

    <!-- Pump / Cap Satin PP Shading -->
    <linearGradient id="toner-cap-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8D4CA"/>
      <stop offset="12%" stop-color="#EFEDE7"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#EBE8DF"/>
      <stop offset="90%" stop-color="#CFCAC0"/>
      <stop offset="100%" stop-color="#DFDBD1"/>
    </linearGradient>

    <!-- Wrap-around Matte Cream Paper Label Shading -->
    <linearGradient id="toner-label-wrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8E4DA"/>
      <stop offset="10%" stop-color="#F7F5F0"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#F6F4EE"/>
      <stop offset="90%" stop-color="#E3DFD4"/>
      <stop offset="100%" stop-color="#D9D4C8"/>
    </linearGradient>

    <!-- Vertical Ambient Occlusion under collars/shoulders -->
    <linearGradient id="toner-collar-ao" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181B17" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#181B17" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Floor Contact Shadow -->
    <radialGradient id="toner-floor-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181B17" stop-opacity="0.22"/>
      <stop offset="48%" stop-color="#181B17" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#181B17" stop-opacity="0"/>
    </radialGradient>

    <!-- Cast Directional Shadow on Plinth (rightward from key light) -->
    <linearGradient id="toner-cast-shadow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#181B17" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#181B17" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#181B17" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Sunlit Fern Shadow Filter -->
    <filter id="toner-fern-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="toner-soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <rect width="600" height="720" fill="url(#toner-bg-glow)"/>
  <!-- Subtle sunlit fern shadow across warm studio plaster -->
  <g opacity="0.075" fill="#3E4F3D" filter="url(#toner-fern-blur)" transform="translate(365, 24) rotate(22) scale(3.6)">
  <path d="M 55.64 28.83 A 24.00 24.00 0 1 1 33.67 9.06" fill="none" stroke="#3E4F3D" stroke-width="0.00" stroke-linecap="round"/>
