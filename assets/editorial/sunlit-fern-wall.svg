<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" role="img" aria-label="Sunlit alabaster plaster wall with layered botanical fern shadows">
  <defs>
    <linearGradient id="sw-wall" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="48%" stop-color="#F2EFE7"/>
      <stop offset="100%" stop-color="#E4DFD3"/>
    </linearGradient>

    <!-- Golden-hour window-pane light beam -->
    <linearGradient id="sw-light-beam" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#FCF9F0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F2EFE7" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft ambient edge vignette -->
    <radialGradient id="sw-vignette" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#F2EFE7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#CFC8B8" stop-opacity="0.32"/>
    </radialGradient>

    <filter id="sw-blur-far" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="sw-blur-mid" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="sw-blur-light" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="800" height="960" fill="url(#sw-wall)"/>

